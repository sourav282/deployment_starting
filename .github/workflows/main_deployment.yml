# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: firstcontainer282.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_001C631AE7D64490998FCDAF7F05C84E }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_5CE80CD1824249B4B660F43B90C0D204 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: firstcontainer282.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_001C631AE7D64490998FCDAF7F05C84E }}/mltest:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_601A48FC91C341D3A5EC463A4C01488C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4E0B9D843CF14E73980B7CCFB5E88875 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4B499268A33E49CF964D79F97781FC22 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'deployment'
          slot-name: 'Production'
          images: 'firstcontainer282.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_001C631AE7D64490998FCDAF7F05C84E }}/mltest:${{ github.sha }}'
          